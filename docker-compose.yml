version: "3.9"

networks:
  ai_platform_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  qdrant_data:
  kafka_data:
  zookeeper_data:

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ai_postgres
    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ai_platform_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d ai_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: ai_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: platform_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-platform_secret}
      MONGO_INITDB_DATABASE: ai_platform
    volumes:
      - mongo_data:/data/db
      - ./infra/docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    ports:
      - "27017:27017"
    networks:
      - ai_platform_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ai_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ai_platform_net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - ai_platform_net
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ai_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - ai_platform_net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ai_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    networks:
      - ai_platform_net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ai_kafka_ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - ai_platform_net

  # ─── Application Services ────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: ai_api_gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:8001
      LEAD_SERVICE_URL: http://lead-service:8002
      AGENT_A_SERVICE_URL: http://agent-a-service:8003
      AGENT_B_SERVICE_URL: http://agent-b-service:8004
      VOICE_SERVICE_URL: http://voice-service:8005
      ANALYTICS_SERVICE_URL: http://analytics-service:8007
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - auth-service
    networks:
      - ai_platform_net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: ai_auth_service
    environment:
      DATABASE_URL: postgresql://platform_user:${POSTGRES_PASSWORD:-platform_secret}@postgres:5432/ai_platform
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRE_MINUTES: 60
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_platform_net

  lead-service:
    build:
      context: ./services/lead-service
      dockerfile: Dockerfile
    container_name: ai_lead_service
    environment:
      DATABASE_URL: postgresql://platform_user:${POSTGRES_PASSWORD:-platform_secret}@postgres:5432/ai_platform
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ai_platform_net

  agent-a-service:
    build:
      context: ./services/agent-a-service
      dockerfile: Dockerfile
    container_name: ai_agent_a_service
    environment:
      MONGODB_URL: mongodb://platform_user:${MONGO_PASSWORD:-platform_secret}@mongodb:27017/ai_platform?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      LEAD_SERVICE_URL: http://lead-service:8002
      VOICE_SERVICE_URL: http://voice-service:8005
    ports:
      - "8003:8003"
    depends_on:
      - mongodb
      - kafka
      - qdrant
    networks:
      - ai_platform_net

  agent-b-service:
    build:
      context: ./services/agent-b-service
      dockerfile: Dockerfile
    container_name: ai_agent_b_service
    environment:
      MONGODB_URL: mongodb://platform_user:${MONGO_PASSWORD:-platform_secret}@mongodb:27017/ai_platform?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LEAD_SERVICE_URL: http://lead-service:8002
      ANALYTICS_SERVICE_URL: http://analytics-service:8007
    ports:
      - "8004:8004"
    depends_on:
      - mongodb
      - kafka
      - qdrant
    networks:
      - ai_platform_net

  voice-service:
    build:
      context: ./services/voice-service
      dockerfile: Dockerfile
    container_name: ai_voice_service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URL: mongodb://platform_user:${MONGO_PASSWORD:-platform_secret}@mongodb:27017/ai_platform?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      # ── Retell AI (Primary Voice Agent) ──────────────────
      RETELL_API_KEY: ${RETELL_API_KEY:-key_3acd90982316f78ff63c2367469b}
      RETELL_AGENT_ID: ${RETELL_AGENT_ID:-agent_cbc4d9dffbfd3df155cccb4828}
      RETELL_WEBHOOK_SECRET: ${RETELL_WEBHOOK_SECRET:-}
      RETELL_BASE_URL: https://api.retellai.com
      # ── Twilio (PSTN Layer under Retell) ─────────────────
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # ── Limits ────────────────────────────────────────────
      MAX_CONCURRENT_CALLS: 500
      CALL_TIMEOUT_SECONDS: 120
      MAX_RETRIES_PER_LEAD: 3
    ports:
      - "8005:8005"
    depends_on:
      - kafka
      - mongodb
    networks:
      - ai_platform_net

  calendar-service:
    build:
      context: ./services/calendar-service
      dockerfile: Dockerfile
    container_name: ai_calendar_service
    environment:
      DATABASE_URL: postgresql://platform_user:${POSTGRES_PASSWORD:-platform_secret}@postgres:5432/ai_platform
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai_platform_net

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: ai_analytics_service
    environment:
      DATABASE_URL: postgresql://platform_user:${POSTGRES_PASSWORD:-platform_secret}@postgres:5432/ai_platform
      MONGODB_URL: mongodb://platform_user:${MONGO_PASSWORD:-platform_secret}@mongodb:27017/ai_platform?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - ai_platform_net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: ai_notification_service
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "3001:3001"
    depends_on:
      - redis
      - kafka
    networks:
      - ai_platform_net

  # ─── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ai_platform_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ai_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3100:3000"
    depends_on:
      - prometheus
    networks:
      - ai_platform_net

  loki:
    image: grafana/loki:2.9.0
    container_name: ai_loki
    ports:
      - "3200:3100"
    networks:
      - ai_platform_net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: ai_promtail
    volumes:
      - /var/log:/var/log
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml
    networks:
      - ai_platform_net
