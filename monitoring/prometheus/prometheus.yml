global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']

  - job_name: 'lead-service'
    static_configs:
      - targets: ['lead-service:8002']

  - job_name: 'agent-a-service'
    static_configs:
      - targets: ['agent-a-service:8003']

  - job_name: 'agent-b-service'
    static_configs:
      - targets: ['agent-b-service:8004']

  - job_name: 'voice-service'
    static_configs:
      - targets: ['voice-service:8005']

  - job_name: 'calendar-service'
    static_configs:
      - targets: ['calendar-service:8006']

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:8007']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3001']
